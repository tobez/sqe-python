[project]
name = "snmp-query-engine"
version = "0.0.0"
description = "Client library for the snmp-query-engine SNMP query daemon"
readme = "README.md"
authors = [{ name = "Anton Berezin", email = "tobez@tobez.org" }]
license = "BSD-2-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "msgpack>=1.0",
]
keywords = ["snmp", "monitoring", "msgpack"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking :: Monitoring",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/tobez/sqe-python"
Changelog = "https://github.com/tobez/sqe-python/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sqe"]

[dependency-groups]
dev = [
    "mypy>=2.2.0",
    "pysmi>=2.0.0",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
    "snmpsim>=1.2.2",
]

[tool.uv]
exclude-newer = "7 days"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: tests requiring a live snmp-query-engine daemon"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "msgpack"
ignore_missing_imports = true
